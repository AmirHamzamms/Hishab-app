name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: App icon
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0d1424' --iconBackgroundColorDark '#0d1424' || true
      - name: Android print support
        run: |
          D=android/app/src/main/java/org/manabmukti/hisabapp
          cat > $D/PrintPlugin.java <<'JAVA'
          package org.manabmukti.hisabapp;

          import android.content.Context;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.WebView;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "HisabPrint")
          public class PrintPlugin extends Plugin {
              @PluginMethod
              public void print(final PluginCall call) {
                  getActivity().runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              WebView wv = getBridge().getWebView();
                              PrintManager pm = (PrintManager) getActivity().getSystemService(Context.PRINT_SERVICE);
                              PrintDocumentAdapter ad = wv.createPrintDocumentAdapter("Hisab");
                              pm.print("Hisab", ad, new PrintAttributes.Builder().build());
                              call.resolve();
                          } catch (Exception e) {
                              call.reject(String.valueOf(e.getMessage()));
                          }
                      }
                  });
              }
          }
          JAVA
          cat > $D/MainActivity.java <<'JAVA'
          package org.manabmukti.hisabapp;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(PrintPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
      - run: npx cap sync android
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hisab-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
